# Starter pack for band 9-12 (SPEC.md R-BAND, Appendix C): the 6-8 pack
# plus this band's own additions. `id` is the launcher entry id
# `omarchy-kids-conf get <kid> allowlist` falls back to when a kid has no
# override (the full pack, in file order).
# `source` (extra/aur) is issue #52's audit against archlinux.org's package search API; see docs/apps.md.

