# web = "garden" for this band (Appendix B): these hosts are the default
# a parent sees for the `sites` key (docs/conf.md) -- the *rendered*
# URLAllowlist comes from share/policy/lists/<band>.txt, which must list
# exactly these hosts (test/shell.d/config-key-readers-test.sh pins it).
# Short and obviously safe on purpose.
[garden]
sites = [
  "pbskids.org",
  "kids.nationalgeographic.com",
  "scratch.mit.edu",
  "youtubekids.com",
  "wikipedia.org",
  "khanacademy.org",
  "code.org",
]
