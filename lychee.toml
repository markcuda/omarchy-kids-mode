# Link checker config (https://github.com/lycheeverse/lychee)
max_concurrency = 8
timeout = 45
max_retries = 2
accept = ["200..=299", "403", "429", "999"]   # bot-blocked sites are not dead links
exclude_private = true
exclude = [
  "^https?://localhost",
  "^https?://127\\.",
  "^https?://192\\.168\\.",
  # Blueprint archive contains known-fabricated URLs on purpose; audit lives in research/sources-audit
  "github\\.com/omarchy/kids-mode",
]
# research/ is a point-in-time snapshot (dated reports + a registry that deliberately records dead links);
# rot-checking applies to the living docs only.
exclude_path = ["research"]
