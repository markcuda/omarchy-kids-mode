name: 📚 Add a source / prior art
description: Found something relevant? Register it so it lands in research/sources.md.
title: "[Source] "
labels: ["type: source", "status: triage"]
body:
  - type: input
    id: title
    attributes:
      label: Title
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL (must be one you personally opened)
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Type
      options:
        - Official docs / manual / man page
        - Source code / repo
        - Wiki (ArchWiki, Hyprland wiki, …)
        - Research paper / report
        - Product (competitor, precedent)
        - Blog post / article
        - Forum / Reddit / Discord thread
        - Video / talk
        - Law / policy / standard
    validations:
      required: true
  - type: input
    id: accessed
    attributes:
      label: Date you accessed it (YYYY-MM-DD)
    validations:
      required: true
  - type: textarea
    id: says
    attributes:
      label: What it actually says (2–5 lines, in your words)
    validations:
      required: true
  - type: textarea
    id: relevance
    attributes:
      label: Why it matters for Kids Mode, and which layer(s)
    validations:
      required: true
